name: Publish Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  publish-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply 1.0.9 release UI fixes
        shell: pwsh
        run: |
          $path = "src/features/settings/pages/SettingsPage.tsx"
          $s = Get-Content $path -Raw
          $s = $s.Replace("const APP_VERSION = '1.0.8';", "const APP_VERSION = '1.0.9';")
          $s = $s.Replace("openFolderPicker, isTauri, checkForUpdates, downloadAndInstallUpdate,", "openFolderPicker, isTauri, checkForUpdates,")
          $s = [regex]::Replace($s, '(?s)\{updateInfo\?\.available \? \(.*?\) : updateInfo && !updateInfo\.available \? \(', '{updateInfo?.error ? (`n                <p className="text-sm text-red-600 dark:text-red-400">Update failed: {updateInfo.error}</p>`n              ) : updateInfo?.available ? (`n                <div className="w-full rounded-lg bg-blue-50 p-4 dark:bg-blue-900/30">`n                  <p className="font-semibold text-blue-700 dark:text-blue-300">`n                    Update {updateInfo.version} is being installed…`n                  </p>`n                  {updateInfo.body && (`n                    <p className="mt-1 text-sm text-blue-600 dark:text-blue-400">{updateInfo.body}</p>`n                  )}`n                </div>`n              ) : updateInfo && !updateInfo.available ? (')
          $s = [regex]::Replace($s, '(?m)^  const handleInstallUpdate = useCallback\(async \(\) => \{\r?\n    await downloadAndInstallUpdate\(\);\r?\n  \}, \[\]\);\r?\n', '')
          Set-Content $path $s -NoNewline
          if ($s -notmatch "const APP_VERSION = '1\.0\.9';") { throw "SettingsPage version patch failed" }
          if ($s -match 'handleInstallUpdate|downloadAndInstallUpdate') { throw "Redundant manual updater handler remains" }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build and publish signed Tauri release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: IKAZE Ledger v__VERSION__
          releaseBody: Signed Windows release for IKAZE Ledger. The generated latest.json is used by the in-app updater.
          releaseDraft: false
          prerelease: false
