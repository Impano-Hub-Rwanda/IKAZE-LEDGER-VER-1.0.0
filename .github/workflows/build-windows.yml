name: Publish Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  publish-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release UI version
        shell: pwsh
        run: |
          $path = "src/features/settings/pages/SettingsPage.tsx"
          $s = Get-Content $path -Raw
          $s = $s.Replace("const APP_VERSION = '1.0.8';", "const APP_VERSION = '1.0.9';")
          Set-Content $path $s -NoNewline
          if ($s -notmatch "const APP_VERSION = '1\.0\.9';") { throw "SettingsPage version patch failed" }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build and publish signed Tauri release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: IKAZE Ledger v__VERSION__
          releaseBody: Signed Windows release for IKAZE Ledger. The generated latest.json is used by the in-app updater.
          releaseDraft: false
          prerelease: false
