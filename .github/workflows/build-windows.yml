name: Publish Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  publish-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply 1.0.9 release UI fixes
        shell: pwsh
        run: |
          $path = "src/features/settings/pages/SettingsPage.tsx"
          $s = Get-Content $path -Raw
          $s = $s.Replace("const APP_VERSION = '1.0.8';", "const APP_VERSION = '1.0.9';")
          $s = $s.Replace("openFolderPicker, isTauri, checkForUpdates, downloadAndInstallUpdate,", "openFolderPicker, isTauri, checkForUpdates,")
          $s = [regex]::Replace($s, "\n  const handleInstallUpdate = useCallback\(async \(\) => \{\r?\n    await downloadAndInstallUpdate\(\);\r?\n  \}, \[\]\);\r?\n", "`n")
          $s = $s.Replace(""""""              {updateInfo?.available ? (
                <div className="w-full rounded-lg bg-blue-50 p-4 dark:bg-blue-900/30">
                  <p className="font-semibold text-blue-700 dark:text-blue-300">
                    Update {updateInfo.version} is available
                  </p>
                  {updateInfo.body && (
                    <p className="mt-1 text-sm text-blue-600 dark:text-blue-400">{updateInfo.body}</p>
                  )}
                  <Button className="mt-3" onClick={handleInstallUpdate}>
                    <span className="flex items-center gap-2"><Download className="h-4 w-4" /> Download & Install</span>
                  </Button>
                </div>
              ) : updateInfo && !updateInfo.available ? ("""""", """"""              {updateInfo?.error ? (
                <p className="text-sm text-red-600 dark:text-red-400">Update failed: {updateInfo.error}</p>
              ) : updateInfo?.available ? (
                <div className="w-full rounded-lg bg-blue-50 p-4 dark:bg-blue-900/30">
                  <p className="font-semibold text-blue-700 dark:text-blue-300">
                    Update {updateInfo.version} is being installed…
                  </p>
                  {updateInfo.body && (
                    <p className="mt-1 text-sm text-blue-600 dark:text-blue-400">{updateInfo.body}</p>
                  )}
                </div>
              ) : updateInfo && !updateInfo.available ? ("""""")
          Set-Content $path $s -NoNewline
          if ($s -notmatch "const APP_VERSION = '1\.0\.9';") { throw "SettingsPage version patch failed" }
          if ($s -match "handleInstallUpdate") { throw "Redundant manual updater handler remains" }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/settings/pages/SettingsPage.tsx
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "fix: finalize updater UI for 1.0.9"
            git push origin HEAD:release
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build and publish signed Tauri release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: IKAZE Ledger v__VERSION__
          releaseBody: Signed Windows release for IKAZE Ledger. The generated latest.json is used by the in-app updater.
          releaseDraft: false
          prerelease: false
